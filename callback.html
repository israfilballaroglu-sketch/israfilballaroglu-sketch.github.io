<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Yetkilendirme kodu – State6Lab Uploader</title>
<style>
  body{margin:0;font-family:Georgia,"Times New Roman",serif;background:#f7f7f5;color:#1d2433;line-height:1.6}
  main{max-width:640px;margin:0 auto;padding:56px 24px}
  h1{font-size:1.8rem;margin:0 0 8px}
  p{color:#48506a}
  textarea{width:100%;box-sizing:border-box;min-height:120px;font:14px/1.5 Consolas,monospace;padding:12px;border:1px solid #c9ccd4;border-radius:6px;background:#fff;color:#1d2433;word-break:break-all}
  button{margin-top:12px;font:inherit;font-size:1rem;padding:10px 20px;border:0;border-radius:6px;background:#1f5fbf;color:#fff;cursor:pointer}
  button:focus-visible{outline:3px solid #9bbcf0;outline-offset:2px}
  .ok{color:#1d7a3d;font-weight:bold}
  .err{color:#a8321f;font-weight:bold}
</style>
</head>
<body>
<main>
  <h1>Yetkilendirme kodu</h1>
  <p id="status">Kod okunuyor…</p>
  <textarea id="code" readonly hidden></textarea>
  <button id="copy" hidden>Kodu kopyala</button>
  <p id="hint" hidden>Kodu uygulamadaki "Mevcut Hesabı Bağla" alanına yapıştırın. Kod bir saat içinde ve yalnızca bir kez kullanılabilir.</p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  var code = (q.get("code") || "").replace(/#_$/, "");
  var status = document.getElementById("status");
  if (code) {
    var box = document.getElementById("code");
    box.value = code; box.hidden = false;
    document.getElementById("copy").hidden = false;
    document.getElementById("hint").hidden = false;
    status.textContent = "İzin verildi. Aşağıdaki kodu kopyalayın.";
    status.className = "ok";
    document.getElementById("copy").onclick = function () {
      box.select();
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject())
        .catch(function(){ document.execCommand("copy"); })
        .finally(function(){ status.textContent = "Kopyalandı. Uygulamaya yapıştırabilirsiniz."; });
    };
  } else if (q.get("error")) {
    status.textContent = "İzin verilmedi: " + (q.get("error_description") || q.get("error"));
    status.className = "err";
  } else {
    status.textContent = "Bu adreste kod bulunamadı. Uygulamadaki bağlantı linkini yeniden açın.";
    status.className = "err";
  }
  history.replaceState(null, "", location.pathname);
</script>
</body>
</html>
